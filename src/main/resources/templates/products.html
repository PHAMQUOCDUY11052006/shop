<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Sản phẩm</title></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
	<h3 class="mb-3">Sản phẩm</h3>
	<div th:replace="~{fragments :: messages}"></div>
	<div class="row row-cols-1 row-cols-md-3 g-3">
		<div class="col" th:each="p : ${products}">
			<div class="card h-100">
				<div class="card-body">
					<h5 class="card-title" th:text="${p.name}"></h5>
					<p class="text-danger fw-bold mb-1" th:text="${#numbers.formatDecimal(p.price,0,'POINT',0,'COMMA')} + ' đ'"></p>
					<p class="text-muted small">Còn <span th:text="${p.stock}"></span> sản phẩm</p>
				</div>
				<div class="card-footer bg-white">
					<form th:action="@{/cart/add}" method="post" class="d-flex gap-2">
						<input type="hidden" name="productId" th:value="${p.id}">
						<input type="number" name="quantity" value="1" min="1" class="form-control" style="width:80px">
						<button class="btn btn-primary" th:disabled="${p.stock == 0}">Thêm vào giỏ</button>
					</form>
				</div>
			</div>
		</div>
	</div>
</div>
</body>
</html>
