<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Thanh toán</title></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
	<h3 class="mb-3">Thanh toán khi nhận hàng (COD)</h3>
	<div th:replace="~{fragments :: messages}"></div>
	<div class="row">
		<div class="col-md-6">
			<form th:action="@{/checkout}" method="post">
				<div class="mb-3"><label class="form-label">Họ tên người nhận</label>
					<input class="form-control" name="receiverName" th:value="${user.fullName}" required></div>
				<div class="mb-3"><label class="form-label">Số điện thoại</label>
					<input class="form-control" name="phone" th:value="${user.phone}" required pattern="\d{9,11}"></div>
				<div class="mb-3"><label class="form-label">Địa chỉ giao hàng</label>
					<input class="form-control" name="address" th:value="${user.address}" required></div>
				<div class="mb-3"><label class="form-label">Ghi chú</label>
					<textarea class="form-control" name="note" rows="2"></textarea></div>
				<div class="alert alert-secondary">Phương thức thanh toán: <b>Thanh toán khi nhận hàng (COD)</b></div>
				<button class="btn btn-success">Đặt hàng</button>
				<a th:href="@{/cart}" class="btn btn-link">Quay lại giỏ hàng</a>
			</form>
		</div>
		<div class="col-md-6">
			<h5>Đơn hàng của bạn</h5>
			<ul class="list-group">
				<li class="list-group-item d-flex justify-content-between" th:each="i : ${items}">
					<span th:text="${i.product.name} + ' x ' + ${i.quantity}"></span>
					<span th:text="${#numbers.formatDecimal(i.subtotal,0,'POINT',0,'COMMA')} + ' đ'"></span>
				</li>
				<li class="list-group-item d-flex justify-content-between fw-bold">
					<span>Tổng cộng</span>
					<span class="text-danger" th:text="${#numbers.formatDecimal(total,0,'POINT',0,'COMMA')} + ' đ'"></span>
				</li>
			</ul>
		</div>
	</div>
</div>
</body>
</html>
