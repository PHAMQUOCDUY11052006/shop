<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Giỏ hàng</title></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
	<h3 class="mb-3">Giỏ hàng</h3>
	<div th:replace="~{fragments :: messages}"></div>
	<div th:if="${items.isEmpty()}" class="alert alert-info">
		Giỏ hàng trống. <a th:href="@{/products}">Tiếp tục mua sắm</a>
	</div>
	<table class="table align-middle" th:unless="${items.isEmpty()}">
		<thead><tr><th>Sản phẩm</th><th>Đơn giá</th><th style="width:220px">Số lượng</th><th>Thành tiền</th><th></th></tr></thead>
		<tbody>
			<tr th:each="i : ${items}">
				<td th:text="${i.product.name}"></td>
				<td th:text="${#numbers.formatDecimal(i.product.price,0,'POINT',0,'COMMA')} + ' đ'"></td>
				<td>
					<form th:action="@{/cart/update}" method="post" class="d-flex gap-2">
						<input type="hidden" name="itemId" th:value="${i.id}">
						<input type="number" name="quantity" th:value="${i.quantity}" min="1"
							th:max="${T(java.lang.Math).min(i.product.stock, maxPerItem)}" class="form-control" style="width:80px">
						<button class="btn btn-outline-primary btn-sm">Cập nhật</button>
					</form>
				</td>
				<td th:text="${#numbers.formatDecimal(i.subtotal,0,'POINT',0,'COMMA')} + ' đ'"></td>
				<td>
					<form th:action="@{/cart/remove}" method="post" onsubmit="return confirm('Xóa sản phẩm này khỏi giỏ?')">
						<input type="hidden" name="itemId" th:value="${i.id}">
						<button class="btn btn-outline-danger btn-sm">Xóa</button>
					</form>
				</td>
			</tr>
		</tbody>
		<tfoot>
			<tr><th colspan="3" class="text-end">Tổng cộng</th>
				<th colspan="2" class="text-danger" th:text="${#numbers.formatDecimal(total,0,'POINT',0,'COMMA')} + ' đ'"></th></tr>
		</tfoot>
	</table>
	<a th:unless="${items.isEmpty()}" th:href="@{/checkout}" class="btn btn-success">Thanh toán (COD)</a>
</div>
</body>
</html>
