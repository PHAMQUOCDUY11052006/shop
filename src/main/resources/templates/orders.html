<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><title>Đơn hàng của tôi</title></head>
<body>
<div th:replace="~{fragments :: navbar}"></div>
<div class="container">
	<h3 class="mb-3">Lịch sử đặt hàng</h3>
	<div th:replace="~{fragments :: messages}"></div>

	<div class="mb-3 d-flex flex-wrap gap-2">
		<a th:href="@{/orders}" class="btn btn-sm btn-outline-dark" th:classappend="${selected == null} ? 'active'">Tất cả</a>
		<a th:each="s : ${statuses}" th:href="@{/orders(status=${s})}" th:text="${s.label}"
			class="btn btn-sm btn-outline-dark" th:classappend="${selected == s} ? 'active'"></a>
	</div>

	<div class="alert alert-info" th:if="${orders.isEmpty()}">Không có đơn hàng nào.</div>

	<div class="card mb-3" th:each="o : ${orders}">
		<div class="card-header d-flex justify-content-between align-items-center">
			<span><b>Đơn #<span th:text="${o.id}"></span></b>
				<small class="text-muted ms-2" th:text="${#temporals.format(o.createdAt,'dd/MM/yyyy HH:mm')}"></small></span>
			<span class="badge text-bg-primary" th:text="${o.status.label}"></span>
		</div>
		<div class="card-body">
			<p class="mb-1">Người nhận: <b th:text="${o.receiverName}"></b> - <span th:text="${o.phone}"></span></p>
			<p class="mb-2">Địa chỉ: <span th:text="${o.address}"></span></p>
			<ul class="mb-2">
				<li th:each="i : ${o.items}" th:text="${i.productName} + ' x ' + ${i.quantity} + ' = ' + ${#numbers.formatDecimal(i.subtotal,0,'POINT',0,'COMMA')} + ' đ'"></li>
			</ul>
			<p class="mb-2">Thanh toán: <b th:text="${o.paymentMethod}"></b> |
				Tổng: <b class="text-danger" th:text="${#numbers.formatDecimal(o.total,0,'POINT',0,'COMMA')} + ' đ'"></b></p>
			<form th:if="${o.status.name() == 'NEW'}" th:action="@{/orders/{id}/cancel(id=${o.id})}" method="post"
				onsubmit="return confirm('Hủy đơn này?')">
				<button class="btn btn-outline-danger btn-sm">Hủy đơn</button>
			</form>
		</div>
	</div>
</div>
</body>
</html>
